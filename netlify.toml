# Skip the deploy when a push only touches the price job, its script or the README
# (they are not part of the website). Exit code 0 = skip, 1 = build.
[build]
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)scripts' ':(exclude).github' ':(exclude)README.md'"

# Redirect www -> non-www (canonical: https://myessentials.co.in)
[[redirects]]
  from = "https://www.myessentials.co.in/*"
  to = "https://myessentials.co.in/:splat"
  status = 301
  force = true

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Shared CSS/JS: cache for a day, then revalidate (files are not fingerprinted)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=604800"
